<html>
    <head>
        <title>my animal fact file</title>
        <style>
            body {
                background-color: darkgreen;
                font-family: Arial, Helvetica, sans-serif;
            }
            .factfile {
                background-color: lightyellow;
                color: darkgray;
                width:260px ;
                padding: 25px;
                border:4px skyblue ;
                margin:30 px ;
            }
            .animal-name {
                color: forestgreen;
                font-size:22 px ;
            }
            .detail {
                color: darkslategray;
            }
            .coolfact {
                color: darkorange;
                font-style: italic;
            }
            </style>
        </head>
        <body>
            <div class="factfile">
            <h2 class="animal-name">snow leopard</h2>
            <p class="detail">type: big cat</p>
            <p class="detail">lives in: mountain ranges of central asia</p>
            <p class="detail">diet;deer, goats, and wild sheep</p>
            <p class="coolfact">cool fact; can leap 15 meters in one jump!</p>
            </div>
            
        </body>
        </html>
